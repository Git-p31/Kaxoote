<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaxoote — ведущий</title>
<link rel="stylesheet" href="style.css">
<style>
.ctrl{position:fixed;right:14px;bottom:14px;z-index:50;display:flex;gap:8px}
.ctrl button{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-weight:900}
/* выбор викторины */
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1200px;width:100%;margin:24px auto}
.qcard{background:#fff;color:#1d1d2b;border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column}
.qcard .cov{height:130px;background:linear-gradient(135deg,#864cbf,#1368ce);background-size:cover;background-position:center}
.qcard .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.qcard h3{margin:0;font-size:19px}
.qcard p{margin:0;color:#6b6b80;font-size:14px;flex:1}
/* лобби */
.pinbar{display:flex;gap:18px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pinbox{background:#fff;color:#1d1d2b;border-radius:14px;padding:14px 26px;text-align:left}
.pinbox small{display:block;font-weight:700;color:#6b6b80}
.pinbox .pin{font-size:clamp(48px,8vw,92px);font-weight:900;letter-spacing:.06em;line-height:1}
.pinbox .url{font-size:20px;font-weight:800;word-break:break-all}
.qr{background:#fff;border-radius:14px;padding:8px;display:flex}
.qr img{width:170px;height:170px}
.lobbyrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px auto 12px;width:100%;max-width:1200px;flex-wrap:wrap}
.players{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1200px;margin:0 auto}
.pl{background:rgba(0,0,0,.3);padding:10px 16px;border-radius:12px;font-weight:800;font-size:20px;animation:popin .45s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
.pl:hover{text-decoration:line-through}
@keyframes popin{from{transform:scale(0) rotate(-12deg)}to{transform:none}}
.waiting{opacity:.8;font-size:22px;font-weight:700;margin-top:30px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
/* вступление */
.intro h1{font-size:clamp(30px,5vw,60px);max-width:1100px;margin:16px auto;line-height:1.1;background:#fff;color:#1d1d2b;padding:24px 30px;border-radius:14px;animation:zoom .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.typetag{display:inline-block;background:#ffc21a;color:#2b0f5e;font-weight:900;padding:6px 14px;border-radius:999px}
.progress{width:min(700px,80vw);height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin:18px auto 0}
.progress i{display:block;height:100%;background:#ffc21a;width:0}
.progress i.run{animation:fill 4s linear forwards}
@keyframes fill{to{width:100%}}
/* вопрос */
.qtitle{background:#fff;color:#1d1d2b;border-radius:12px;padding:16px 24px;font-size:clamp(22px,3vw,38px);font-weight:800;text-align:center;line-height:1.15}
.qmid.slide{display:none}
.qmid{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 150px;align-items:center;gap:16px;margin:16px 0;min-height:240px}
.timer{width:130px;height:130px;position:relative}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .n{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:900}
.timer.urgent .n{color:#ffc21a;animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.media{display:flex;justify-content:center;align-items:center;height:100%;min-height:220px}
.media img{max-width:100%;max-height:46vh;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:zoom .5s}
.media .hint{font-size:28px;font-weight:800;opacity:.9;text-align:center}
.counter{text-align:center}
.counter b{display:block;font-size:56px;line-height:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;color:#fff;border-radius:10px;padding:16px 18px;min-height:86px;font-size:clamp(18px,2.2vw,28px);font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.25);position:relative;overflow:hidden;transition:opacity .3s,transform .3s}
.opt .shape{width:42px;height:42px;flex:none}
.opt .txt{flex:1}
.opt .cnt{font-size:28px;font-weight:900;display:none}
.opt .bar{position:absolute;left:0;bottom:0;height:8px;background:rgba(255,255,255,.7);width:0;transition:width 1s ease}
.reveal .opt .cnt{display:block}
.reveal .opt.no{opacity:.28;transform:scale(.97)}
.reveal .opt.yes{transform:scale(1.02)}
.reveal .opt.yes{outline:4px solid #fff;outline-offset:-4px}
.orderlist{display:grid;gap:10px;max-width:900px;margin:0 auto;width:100%}
.orderlist div{display:flex;gap:14px;align-items:center;background:rgba(0,0,0,.3);padding:14px 18px;border-radius:10px;font-size:24px;font-weight:800}
.orderlist div.a3{background:var(--green)}
.orderlist div b{background:#fff;color:#2b0f5e;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.sliderview{max-width:900px;margin:0 auto;width:100%;text-align:center}
.scale{position:relative;height:16px;background:rgba(255,255,255,.25);border-radius:99px;margin:40px 0 12px}
.scale .mark{position:absolute;top:-8px;width:4px;height:32px;background:#fff;border-radius:2px}
.scale .ans{position:absolute;top:-30px;transform:translateX(-50%);background:#2bd96b;color:#06301a;font-weight:900;padding:6px 12px;border-radius:8px;white-space:nowrap}
.scale .tol{position:absolute;top:0;height:100%;background:rgba(43,217,107,.55);border-radius:99px}
.scale .dot{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:#ffc21a;transform:translateX(-50%)}
.scaleLbl{display:flex;justify-content:space-between;font-weight:800;font-size:20px}
.typed{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.typed span{background:rgba(0,0,0,.3);padding:12px 18px;border-radius:10px;font-size:24px;font-weight:800}
.typed span.ok{background:var(--green)}
.explain{background:#fff;color:#1d1d2b;border-radius:14px;padding:16px 22px;margin:14px auto 0;max-width:1000px;font-size:20px;animation:zoom .5s;display:flex;gap:14px;align-items:flex-start}
.explain b{color:#864cbf;white-space:nowrap;flex:none}
.slidebody{background:#fff;color:#1d1d2b;border-radius:14px;padding:26px 30px;max-width:1000px;margin:24px auto 0;font-size:24px;white-space:pre-wrap}
.stats{text-align:center;font-weight:800;font-size:20px;opacity:.9;margin-top:6px}
/* таблица лидеров */
.lb{max-width:900px;width:100%;margin:24px auto;display:grid;gap:12px}
.lbrow{display:flex;align-items:center;gap:16px;background:#fff;color:#1d1d2b;border-radius:12px;padding:14px 20px;font-size:26px;font-weight:900;animation:slidein .5s both}
.lbrow:first-child{background:#ffc21a}
.lbrow .rk{width:40px}
.lbrow .nm{flex:1;text-align:left}
.lbrow .up{font-size:16px;color:#26890c}
.lbrow .fl{font-size:16px;background:#ff6a00;color:#fff;border-radius:99px;padding:2px 10px}
@keyframes slidein{from{transform:translateX(-60px);opacity:0}}
/* подиум */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:30px;min-height:52vh}
.col{width:min(240px,28vw);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
.col.show{opacity:1;animation:rise .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(80px);opacity:0}}
.col .who{font-size:clamp(20px,2.6vw,32px);font-weight:900;text-align:center}
.col .av{font-size:56px}
.col .blk{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;font-weight:900;box-shadow:inset 0 -10px 0 rgba(0,0,0,.2)}
.col .blk .pl1{font-size:60px;line-height:1}
.c1 .blk{height:42vh;background:#ffc21a;color:#2b0f5e}
.c2 .blk{height:30vh;background:#d9dde6;color:#2b0f5e}
.c3 .blk{height:22vh;background:#e09a5b;color:#2b0f5e}
.rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.rest span{background:rgba(0,0,0,.3);padding:8px 14px;border-radius:10px;font-weight:700}
.bottombar{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media(max-width:800px){.qmid{grid-template-columns:1fr;}.timer{margin:0 auto}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bgshapes" id="bg"></div>
<div class="ctrl"><button id="mute" title="Звук">🔊</button><button id="music" title="Музыка">♪</button><button id="full" title="Во весь экран">⛶</button></div>

<!-- выбор викторины -->
<section class="screen on" id="sPick">
  <div class="topbar"><a href="./" class="logo" style="color:#fff;text-decoration:none"><b>Ka</b>xoote</a><a class="btn ghost" href="editor.html" style="text-decoration:none">Редактор</a></div>
  <h1 style="text-align:center;font-size:clamp(28px,4vw,46px);margin:26px 0 0">Какую викторину проводим?</h1>
  <div class="qlist" id="qlist"></div>
</section>

<!-- лобби -->
<section class="screen" id="sLobby">
  <div class="pinbar">
    <div class="pinbox"><small>Заходи на</small><div class="url" id="joinUrl"></div></div>
    <div class="pinbox"><small>PIN игры</small><div class="pin" id="pin"></div></div>
    <div class="qr"><img id="qr" alt="QR-код для входа"></div>
  </div>
  <div class="lobbyrow">
    <div class="pill" id="pcount">0 игроков</div>
    <div class="logo" id="lobbyTitle" style="font-size:22px"></div>
    <div style="display:flex;gap:10px"><button class="btn ghost" id="lockBtn">Закрыть вход</button><button class="btn primary" id="startBtn">Начать ▶</button></div>
  </div>
  <div class="players" id="players"></div>
  <div class="waiting center" id="waiting">Ждём игроков…</div>
</section>

<!-- вступление вопроса -->
<section class="screen center intro" id="sIntro">
  <div class="pill" id="iNum"></div>
  <h1 id="iText"></h1>
  <span class="typetag" id="iType"></span>
  <div class="progress"><i id="iBar"></i></div>
</section>

<!-- вопрос / ответ -->
<section class="screen" id="sQ">
  <div class="topbar" style="margin-bottom:12px"><div class="pill" id="qNum"></div><span class="typetag" id="qType"></span><button class="btn ghost" id="skipBtn">Дальше ⏭</button></div>
  <div class="qtitle" id="qText"></div>
  <div class="qmid">
    <div class="timer" id="timer"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.2)" stroke-width="12" fill="#46178f"/><circle id="tArc" cx="60" cy="60" r="52" stroke="#ffc21a" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="0"/></svg><div class="n" id="tNum">20</div></div>
    <div class="media" id="media"></div>
    <div class="counter" id="counter"><b id="aCount">0</b>ответов</div>
  </div>
  <div id="answerArea"></div>
  <div id="explainBox"></div>
  <div class="stats" id="statsLine"></div>
</section>

<!-- лидеры -->
<section class="screen" id="sLB">
  <h1 style="text-align:center;font-size:clamp(30px,4vw,52px);margin:16px 0 0">Таблица лидеров</h1>
  <div class="lb" id="lb"></div>
  <div class="bottombar"><button class="btn primary" id="lbNext">Дальше ▶</button></div>
</section>

<!-- подиум -->
<section class="screen center" id="sPod">
  <h1 style="font-size:clamp(30px,4vw,52px);margin:10px 0 0" id="podTitle">Победители</h1>
  <div class="pod">
    <div class="col c2" id="c2"></div>
    <div class="col c1" id="c1"></div>
    <div class="col c3" id="c3"></div>
  </div>
  <div class="rest" id="rest"></div>
  <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="again">Сыграть ещё раз</button><a class="btn ghost" style="text-decoration:none" href="host.html">Другая викторина</a></div>
</section>

<script src="lib/mqtt.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="store.js"></script>
<script src="net.js?v=3"></script>
<script src="fx.js"></script>
<script src="host.js?v=3"></script>
</body>
</html>
